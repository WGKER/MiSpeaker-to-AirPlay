name: Build MiAir (arm64 only, download only)

on:
  push:
    branches:
      - docker
  workflow_dispatch:

# 注意：这里env必须和on、jobs同级，且缩进为0
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 👇 在这里定义你自定义的镜像名和标签，只改这里即可，后面会自动引用变量
  IMAGE_NAME: miair
  IMAGE_TAG: v0.2.1-alpha-arm64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Docker mirror config
        run: |
          echo '{"registry-mirrors":["https://docker.mirrors.ustc.edu.cn"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image and export to tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=${{ env.IMAGE_NAME }}_${{ env.IMAGE_TAG }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IMAGE_NAME }}_${{ env.IMAGE_TAG }}.tar
          path: ${{ env.IMAGE_NAME }}_${{ env.IMAGE_TAG }}.tar
