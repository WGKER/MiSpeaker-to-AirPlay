name: Build MiAir (arm64 only, download only)

on:
  push:
    branches:
      - docker
  workflow_dispatch:

# 注意：这里env必须和on、jobs同级，且缩进为0
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Docker mirror config
        run: |
          echo '{"registry-mirrors":["https://docker.mirrors.ustc.edu.cn"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build arm64 image and export to tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          tags: miair:v0.2.1-alpha-arm64
          outputs: type=docker,dest=miair-arm64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zip the tar file
        run: |
          zip miair-arm64.zip miair-arm64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: miair-arm64-image
          path: miair-arm64.zip
